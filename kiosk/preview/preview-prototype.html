    <style>@font-face{font-family:Pretendard;font-weight:200;src:url(https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-ExtraLight.woff2)}@font-face{font-family:Pretendard;font-weight:500;src:url(https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2)}@font-face{font-family:Pretendard;font-weight:600;src:url(https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2)}@font-face{font-family:Pretendard;font-weight:700;src:url(https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2)}@font-face{font-family:Pretendard;font-weight:800;src:url(https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-ExtraBold.woff2)}:root{--meter-ok:#3a9e78;--meter-track:var(--deck-2);--step-done:#34215f;
  /* 여백 단계 */
  --step-done: #34215f;

  /* 여백 단계 */
  --meter-ok: #3a9e78;
  --meter-track: var(--deck-2);

  /* 여백 단계 */
  --r-3: 3px;
  --r-6: 6px;
  --r-8: 8px;
  --r-10: 10px;
  --r-12: 12px;
  --r-14: 14px;
  --r-16: 16px;
  --r-18: 18px;
  --r-20: 20px;
  --r-28: 28px;
  --r-pill: 999px;

  /* 여백 단계 */
  --space-2: 2px;
  --space-4: 4px;
  --space-6: 6px;
  --space-8: 8px;
  --space-10: 10px;
  --space-12: 12px;
  --space-14: 14px;
  --space-16: 16px;
  --space-18: 18px;
  --space-20: 20px;
  --space-24: 24px;
  --space-28: 28px;
  --space-32: 32px;
  --space-36: 36px;
  --space-40: 40px;
  --space-64: 64px;
--ink: #0e0c1c;--deck: #16142d;--deck-2: #1f1b3b;--deck-3: #2a2550;--line: #312b5a;--text: #f3f1fa;--text-2: #aaa4c8;--text-3: #6d6790;--violet: #9044eb;--violet-hi: #a873ff;--violet-soft: rgba(144, 68, 235, .16);--ember: #f29a4a;--brand: linear-gradient(115deg, #7d3ee6 0%, #b04fd6 48%, #f29a4a 100%);--rec: #ff5c63;--rec-soft: rgba(255, 92, 99, .16);--pause: #f5b544;--ok: #3ddc97;--r-sm: var(--r-12);--r-md: var(--r-16);--r-lg: var(--r-18);--shadow-pop: 0 24px 64px rgba(4, 2, 14, .55)}*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-tap-highlight-color:transparent}html,body,#root{margin:0;padding:0;width:100%;height:100%;background:var(--ink);overflow:hidden}body{font-family:Pretendard,system-ui,sans-serif;font-weight:500;color:var(--text);font-size:20px;line-height:1.4}input{font-family:inherit;-webkit-user-select:text;user-select:text}button{font-family:inherit}:focus{outline:none}:focus-visible{outline:3px solid var(--violet-hi);outline-offset:3px}.num{font-variant-numeric:tabular-nums}.t-display{font-size:92px;font-weight:700;letter-spacing:-.02em;line-height:1}.t-h1{font-size:34px;font-weight:700;letter-spacing:-.01em}.t-h2{font-size:26px;font-weight:700}.t-body{font-size:22px;font-weight:500}.t-label{font-size:18px;font-weight:600;color:var(--text-2)}.t-small{font-size:15px;font-weight:500;color:var(--text-3)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:var(--r-md);cursor:pointer;color:var(--text);font-weight:700;white-space:nowrap;transition:transform 80ms ease,filter .12s ease,background .12s ease}.btn:active:not(:disabled){transform:scale(.98);filter:brightness(.92)}.btn:disabled{cursor:default;opacity:.38}.btn-lg{height:92px;padding:0 36px;font-size:26px;border-radius:var(--r-lg)}.btn-md{height:68px;padding:0 28px;font-size:22px}.btn-sm{height:52px;padding:0 20px;font-size:18px;border-radius:var(--r-sm)}.btn-block{width:100%}.btn-primary{background:var(--violet)}.btn-primary:hover:not(:disabled){background:#9b55f0}.btn-brand{background:var(--brand)}.btn-secondary{background:var(--deck-2);box-shadow:inset 0 0 0 2px var(--line)}.btn-secondary:hover:not(:disabled){background:var(--deck-3)}.btn-outline{background:transparent;color:var(--violet-hi);box-shadow:inset 0 0 0 2px var(--violet)}.btn-ghost{background:transparent;color:var(--text-2)}.btn-rec{background:var(--rec)}.icon-btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;width:56px;height:56px;border-radius:var(--r-16);background:transparent;color:var(--text-2);transition:background .12s ease,color .12s ease}.icon-btn:hover:not(:disabled){background:var(--deck-2);color:var(--text)}.icon-btn:disabled{opacity:.3;cursor:default}.field{display:flex;flex-direction:column;gap:10px}.field-box{display:flex;align-items:center;height:80px;padding:0 12px 0 24px;gap:8px;background:var(--deck-2);border-radius:var(--r-lg);box-shadow:inset 0 0 0 2px var(--line);transition:box-shadow .12s ease}.field-box:focus-within{box-shadow:inset 0 0 0 2px var(--violet)}.field-box input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--text);font-size:26px;font-weight:600}.field-box input::placeholder{color:var(--text-3)}.field-box input:focus-visible,.field-box select:focus-visible{outline:none}.switch{position:relative;width:76px;height:42px;border-radius:var(--r-pill);background:var(--deck-3);border:0;cursor:pointer;transition:background .16s ease;flex:none}.switch:after{content:"";position:absolute;top:5px;left:5px;width:32px;height:32px;border-radius:50%;background:var(--text-2);transition:transform .16s ease,background .16s ease}.switch.on{background:var(--violet)}.switch.on:after{transform:translate(34px);background:#fff}.chip{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:64px;min-width:132px;padding:0 24px;border-radius:var(--r-pill);border:0;cursor:pointer;background:var(--deck-2);color:var(--text-2);font-size:22px;font-weight:700;box-shadow:inset 0 0 0 2px var(--line)}.chip.on{background:var(--violet);color:#fff;box-shadow:none}.chip:disabled{opacity:.35;cursor:default}.chip small{font-size:13px;font-weight:700;opacity:.7}.panel{background:var(--deck);border-radius:var(--r-lg)}.rows{display:flex;flex-direction:column;background:var(--deck);border-radius:var(--r-lg);overflow:hidden}.row{display:flex;align-items:center;gap:20px;min-height:84px;padding:16px 28px}.row+.row{border-top:1px solid var(--line)}.row .k{width:150px;flex:none;color:var(--text-2);font-size:20px;font-weight:600}.row .v{flex:1;min-width:0;font-size:24px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scroll{overflow-y:auto;overscroll-behavior:contain}.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--r-3)}.overlay{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#0604109e;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.dialog{width:760px;max-width:calc(100% - 48px);max-height:calc(100% - 48px);display:flex;flex-direction:column;background:#1b1835;border-radius:var(--r-lg);box-shadow:var(--shadow-pop),inset 0 0 0 1px var(--line);animation:dialog-in .16s ease-out}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:var(--space-32) var(--space-24) var(--space-8) var(--space-40)}.dialog-body{padding:var(--space-16) var(--space-40) var(--space-8);overflow-y:auto}.dialog-foot{display:flex;gap:16px;padding:var(--space-24) var(--space-40) var(--space-40)}.dialog-foot>*{flex:1}@keyframes dialog-in{0%{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}.stage{position:relative;background:#000;border-radius:var(--r-lg);overflow:hidden;box-shadow:inset 0 0 0 3px var(--tally, var(--line))}.stage:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--tally, var(--line));pointer-events:none}.stage.rec{--tally: var(--rec)}.stage.rec:after{animation:tally 1.6s ease-in-out infinite}.stage.paused{--tally: var(--pause)}.stage.ready{--tally: rgba(144, 68, 235, .55)}@keyframes tally{50%{box-shadow:inset 0 0 0 3px var(--rec),inset 0 0 48px #ff5c6359}}.tally-pill{position:absolute;top:20px;left:20px;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px;border-radius:var(--r-pill);background:#0a0816b8;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:18px;font-weight:700}.tally-pill i{width:12px;height:12px;border-radius:50%;background:currentColor}.remote-pill{position:absolute;top:112px;left:50%;transform:translate(-50%);z-index:9999;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 20px;border-radius:var(--r-pill);background:#f5b54429;border:1px solid rgba(245,181,68,.5);color:var(--pause);font-size:18px;font-weight:700;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:none}.remote-pill i{width:10px;height:10px;border-radius:50%;background:currentColor;animation:blink 1.2s steps(1) infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.drag{-webkit-app-region:drag}.no-drag{-webkit-app-region:no-drag}

/* [C4] 아이콘: 헤더·푸터 24px, 내용 32px, 선 굵기는 크기와 상관없이 화면에서 2px */
svg[viewBox="0 0 24 24"] { stroke-width: 2; }
svg[width="18"] { stroke-width: 2.667; }
svg[width="20"] { stroke-width: 2.4; }
svg[width="22"] { stroke-width: 2.182; }
svg[width="26"] { stroke-width: 1.846; }
svg[width="40"] { stroke-width: 1.2; }
svg[width="44"] { stroke-width: 1.091; }
svg[width="48"] { stroke-width: 1; }
svg[width="52"] { stroke-width: 0.923; }
svg[width="56"] { stroke-width: 0.857; }
svg:is([width="28"], [width="30"], [width="32"], [width="34"], [width="36"]) { width: 32px; height: 32px; stroke-width: 1.5; }
:is(header, footer) svg[width] { width: 24px; height: 24px; stroke-width: 2; }

/* [C5] 헤더 아이콘(처음으로·설정)은 28px, 선은 화면에서 2px */
header svg[width] { width: 28px; height: 28px; stroke-width: 1.714; }

/* [C12] 창 안의 입력칸·버튼은 창(18px)보다 한 단계 작은 라운드 */
.dialog :is(.btn, .field-box) { border-radius: var(--r-14); }

/* [C17] 중간 버튼(고객센터 등)은 창 밖 버튼과 같은 18px, 아이콘 버튼은 14px (창 안 버튼은 C12 규칙으로 14px) */
.btn-md { border-radius: var(--r-lg); }
.icon-btn { border-radius: var(--r-14); }

/* [C18] 프리뷰가 비어 있을 때 상태 (design/PreviewStatus.tsx) */
.pv-status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-12); text-align: center; overflow: hidden; color: var(--text-3); background: radial-gradient(120% 100% at 50% 50%, #1a1535 0%, #0b0918 100%); --pv-glow: var(--violet); }
.pv-status > * { position: relative; }
.pv-status::before { content: ""; position: absolute; top: 50%; left: 0; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--pv-glow) 42%, transparent) 0%, transparent 62%); filter: blur(24px); opacity: 0; animation: pv-sweep 4s ease-in-out infinite; }
.pv-status.retry { --pv-glow: color-mix(in srgb, var(--pause) 75%, var(--violet)); }
.pv-status.off::before { display: none; }
.pv-icon { flex: none; }
.pv-status.wait .pv-icon { animation: pv-spin 1.2s linear infinite; }
.pv-status.retry .pv-icon { animation: pv-spin 1.6s cubic-bezier(.6, 0, .4, 1) infinite; }
@keyframes pv-spin { to { transform: rotate(360deg); } }
.pv-title { font-size: 26px; font-weight: 700; color: var(--text); }
.pv-sub { font-size: 18px; font-weight: 500; color: var(--text-2); }
@keyframes pv-sweep {
  0% { transform: translate(-90%, -50%); opacity: 0; }
  25% { opacity: 1; }
  75% { opacity: 1; }
  100% { transform: translate(140%, -50%); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .pv-status::before { animation: none; opacity: 0.7; transform: translate(20%, -50%); } .pv-icon { animation: none !important; } }
</style>
